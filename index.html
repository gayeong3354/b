<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 청첩장 준비 중 🤍</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #faf9f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #333;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 360px;
            width: 100%;
        }
        .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #4a4a4a;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        p {
            font-size: 14px;
            color: #777;
            line-height: 1.6;
            margin: 0;
        }
        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
            border-top: 1px dashed #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">💌</div>
        <h1>소중한 순간을 예쁘게 담는 중입니다</h1>
        <p>
            저희의 모바일 청첩장을 예쁘게 단장하고 있어요.<br>
            정성껏 완성해서 곧 반갑게 맞이할게요!🤍<br><br>
            완성된 후 이 QR코드를 다시 스캔해 주시면<br>바로 확인하실 수 있습니다.
        </p>
        <div class="footer-note">
            모바일 청첩장 오픈 준비 중
        </div>
    </div>
</body>
</html>
