<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    overflow:hidden;
    font-family:"Malgun Gothic",sans-serif;
    animation:bright 2s forwards;
    animation-delay:1s;
}

.container{
    text-align:center;
}

.name{
    font-size:36pt;
    font-weight:bold;
    color:black;
    opacity:0;
    animation:showName 1.5s forwards;
    animation-delay:2s;
}

.question{
    font-size:35pt;
    font-weight:bold;
    color:#e6004c;
    margin-top:30px;
    opacity:0;
    text-shadow:0 0 15px rgba(255,105,180,.4);
    animation:showQuestion 1.5s forwards;
    animation-delay:4s;
}

.heart{
    animation:beat 1s infinite;
    display:inline-block;
}

@keyframes bright{
    from{
        background:#000;
    }
    to{
        background:#fff7fb;
    }
}

@keyframes showName{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes showQuestion{
    from{
        opacity:0;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.2);}
}
</style>
</head>

<body>

<div class="container">
    <div class="name">
        상빈아!
    </div>

    <div class="question">
        <span class="heart">❤️</span>
        나랑 결혼하자
        <span class="heart">❤️</span>
    </div>
</div>

</body>
</html>
